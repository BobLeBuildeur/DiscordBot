[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-service"
version = "0.1.0"
description = "HTTP auth service (file-backed users, HS256 JWT)"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.0.0",
  "email-validator>=2.0.0",
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.11.0",
  "PyJWT>=2.9.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
auth-create-user = "auth_service.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["auth_service*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
