[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestration-server"
version = "0.1.0"
description = "Agentic orchestrator PoC service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "mcp>=1.0",
  "openai>=1.109.0",
  "posthog>=3.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
